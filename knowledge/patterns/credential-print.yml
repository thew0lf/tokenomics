id: credential-print
version: 1
pattern: credential_print
category: credentials
severity: high
signals:
  - "a credential file is printed, filtered, masked or has its keys listed"
problem: "A masking expression written against an assumed shape can match nothing and print the raw secret."
recommendation: "Never emit bytes from a credential file; learn its shape from size and match counts, pipe values into the consuming command, and rotate anything that reached output."
policy: docs/POLICY.md
privacy:
  requires_raw_conversation: false
