[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenomics"
version = "0.3.1"
description = "Local-first AI token usage observability and optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GGCLTMGT" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.6,<1", "mcp>=2.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp>=2.2,<3"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
tokenomics = "tokenomics.cli:main"
tokenomics-mcp = "tokenomics.mcp_server:main"
tokenomics-dashboard = "tokenomics.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["tokenomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["tokenomics"]
