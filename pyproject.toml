[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenomics"
version = "0.2.0"
description = "Local-first AI token usage observability and optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GGCLTMGT" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mcp>=2.2,<3",
]
mcp = [
  "mcp>=2.2,<3",
]

[project.scripts]
tokenomics = "tokenomics.cli:main"
tokenomics-mcp = "tokenomics.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["tokenomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
